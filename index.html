<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Electrofik – Comparador de Electrónica</title>
  <meta name="description" content="Compara precios y especificaciones de los mejores productos electrónicos." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">⚡ Electro<span>fik</span></div>
      <p class="tagline">Comparador de electrónica</p>
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input
          type="search"
          id="search-input"
          placeholder="Buscar producto o marca…"
          autocomplete="off"
        />
      </div>
    </div>
  </header>

  <!-- ── Main ───────────────────────────────────────────────────────────── -->
  <main class="main-content">

    <div class="section-heading">
      <h2>Productos electrónicos</h2>
      <p>Selecciona hasta 3 productos y compara sus especificaciones en detalle.</p>
    </div>

    <!-- Category Tabs -->
    <div class="category-tabs" id="category-tabs"></div>

    <!-- Product Grid -->
    <div class="product-grid" id="product-grid"></div>

    <!-- Comparison Table (shown after clicking "Comparar") -->
    <div class="comparison-panel" id="comparison-panel"></div>

  </main>

  <!-- ── Compare Tray (sticky bottom bar) ───────────────────────────────── -->
  <div class="compare-tray" id="compare-tray">
    <div class="tray-inner">
      <span class="tray-label">
        Comparar <span class="tray-count" id="compare-count">0</span>
      </span>
      <div class="tray-items" id="compare-items"></div>
      <div class="tray-actions">
        <button class="btn-primary" onclick="openComparison()">Ver comparativa</button>
        <button class="btn-ghost" onclick="clearCompare()">Limpiar</button>
      </div>
    </div>
  </div>

  <!-- ── Footer ─────────────────────────────────────────────────────────── -->
  <footer class="site-footer">
    <p>© 2024 Electrofik · Comparador de electrónica · Todos los precios son orientativos.</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
